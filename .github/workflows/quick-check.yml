name: Quick compile check

# Compiles only the Kotlin and Java code (no engine, no native build): about 5 minutes.
# Use it to catch code errors fast before the 30+ minute full APK build.
on:
  push:
  workflow_dispatch:

concurrency:
  group: check-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-22.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 17
      - name: Set up Gradle 8.7
        run: |
          set -e
          for i in 1 2 3; do
            wget -q https://services.gradle.org/distributions/gradle-8.7-bin.zip -O /tmp/gradle.zip && break
            sleep 5
          done
          unzip -q /tmp/gradle.zip -d "$HOME/gradle-dist"
          echo "$HOME/gradle-dist/gradle-8.7/bin" >> "$GITHUB_PATH"
      - name: Compile Kotlin and Java
        run: |
          set -o pipefail
          mkdir -p build-logs
          gradle compileDebugKotlin compileDebugJavaWithJavac --no-daemon --console=plain --stacktrace 2>&1 | tee build-logs/compile.log
      - name: Summary
        if: always()
        run: |
          {
            echo "## Compile check"
            echo '```'
            grep -E "^e: |error:|FAILED|BUILD (SUCCESSFUL|FAILED)" build-logs/compile.log | head -40 || true
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: compile-log
          path: build-logs
