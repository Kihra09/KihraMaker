name: Build APK

on:
  push:
  workflow_dispatch:

# A new push cancels the older run of the same branch instead of wasting 30+ minutes.
concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-22.04
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 17

      - name: Install build tools
        run: |
          sudo apt-get update -y
          sudo apt-get install -y build-essential cmake xxd autoconf automake libtool libtool-bin \
            pkg-config ruby-full bison wget git

      - name: Install Android NDK 23.2.8568313
        run: |
          SDKM="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          yes | "$SDKM" --licenses > /dev/null || true
          "$SDKM" "ndk;23.2.8568313"
          test -f "$ANDROID_HOME/ndk/23.2.8568313/source.properties"
          echo "ANDROID_NDK_HOME=$ANDROID_HOME/ndk/23.2.8568313" >> "$GITHUB_ENV"

      # Building Ruby, OpenAL, OpenSSL... takes a while. Progress is cached after every run, even a
      # failed one, so a retry continues where the last run stopped.
      - name: Restore engine build cache
        uses: actions/cache/restore@v5
        with:
          path: app/jni
          key: engine-${{ hashFiles('scripts/build-engine.sh', 'native/Application.mk') }}-${{ github.run_id }}
          restore-keys: |
            engine-${{ hashFiles('scripts/build-engine.sh', 'native/Application.mk') }}-

      - name: Build engine dependencies
        run: ./scripts/build-engine.sh

      - name: Save engine build cache
        if: always() && hashFiles('app/jni/.fetched') != ''
        uses: actions/cache/save@v5
        with:
          path: app/jni
          key: engine-${{ hashFiles('scripts/build-engine.sh', 'native/Application.mk') }}-${{ github.run_id }}

      - uses: gradle/actions/setup-gradle@v5
        with:
          gradle-version: 8.7

      - name: Build APK
        run: gradle assembleRelease --no-daemon --stacktrace --console=plain

      - name: Check the APK contains the engine
        run: |
          APK=$(ls app/build/outputs/apk/release/*.apk | head -1)
          echo "APK: $APK"
          unzip -l "$APK" | grep -E "lib/arm64-v8a/lib(mkxp-z|SDL2|ruby|openal)\.so"
          unzip -l "$APK" | grep -q "lib/arm64-v8a/libmkxp-z.so" || { echo "::error::libmkxp-z.so missing from the APK"; exit 1; }

      - uses: actions/upload-artifact@v5
        with:
          name: KihraMaker-apk
          path: app/build/outputs/apk/release/*.apk
          if-no-files-found: error

      # On any failure keep the full logs so the real error can be read.
      - name: Upload logs
        if: failure()
        uses: actions/upload-artifact@v5
        with:
          name: build-logs
          path: |
            build-logs/
            app/build/outputs/logs/
            app/.cxx/**/*.txt
          if-no-files-found: ignore
